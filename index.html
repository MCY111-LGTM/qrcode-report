<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>房屋安全鉴定报告</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "SimSun", "宋体", serif;
            background: #fff;
            padding: 10px;
            color: #000;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            padding: 15px 10px;
            line-height: 1.8;
            border: 1px solid #000;
            border-bottom: none;
            background: #fff;
        }
        .header .title {
            font-size: 16px;
        }
        .header .sub {
            font-size: 14px;
            margin-top: 5px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        table td {
            border: 1px solid #000;
            padding: 10px 12px;
            font-size: 14px;
            line-height: 1.8;
            vertical-align: top;
        }
        table td.label {
            font-weight: bold;
            text-align: center;
            width: 35%;
            white-space: nowrap;
        }
        table td.value {
            text-align: left;
        }
        .report-code {
            text-align: center;
            font-size: 14px;
            margin: 10px 0 20px;
        }
        .error {
            text-align: center;
            padding: 40px 20px;
            color: #000;
            font-size: 16px;
        }
        .loading {
            text-align: center;
            padding: 40px 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="content">
            <div class="loading">加载中...</div>
        </div>
    </div>

    <script src="data.js"></script>
    <script>
        function getQueryParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        function renderReport(report) {
            const content = document.getElementById('content');
            
            const header = `
                <div class="header">
                    <div class="title">该报告主要信息已上传至市住建委"北京市城镇房屋建筑使用安全管理系统"</div>
                </div>
            `;

            const rows = [
                ['报告类型', report.type || ''],
                ['报告唯一编码', report.code || ''],
                ['机构备案编号', report.orgCode || ''],
                ['鉴定机构', report.org || ''],
                ['项目名称', report.project || ''],
                ['房屋建筑地址', report.address || ''],
                ['评估鉴定结论', report.conclusion || ''],
                ['评估鉴定结论解释', report.conclusionDetail || ''],
                ['鉴定负责人', report.leader || ''],
                ['审核人', report.reviewer || ''],
                ['批准人', report.approver || ''],
                ['鉴定人', report.appraisers || '']
            ];

            let tableRows = '';
            rows.forEach(([label, value]) => {
                tableRows += `
                    <tr>
                        <td class="label">${label}</td>
                        <td class="value">${value}</td>
                    </tr>
                `;
            });

            content.innerHTML = header + `<table>${tableRows}</table>`;
        }

        function renderError(msg) {
            document.getElementById('content').innerHTML = `<div class="error">${msg}</div>`;
        }

        document.addEventListener('DOMContentLoaded', function() {
            const code = getQueryParam('code');
            if (!code) {
                renderError('未指定报告编号');
                return;
            }

            const report = window.REPORT_DATA[code];
            if (!report) {
                renderError('未找到该报告');
                return;
            }

            renderReport(report);
        });
    </script>
</body>
</html>
