<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title></title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "SimSun", "宋体", serif;
            background: #fff;
            padding: 10px;
            color: #000;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            padding: 15px 10px;
            line-height: 1.8;
            border: 1px solid #000;
            border-bottom: none;
            background: #fff;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        table td {
            border: 1px solid #000;
            padding: 10px 12px;
            font-size: 14px;
            line-height: 1.8;
            vertical-align: top;
        }
        table td.label {
            font-weight: bold;
            text-align: center;
            width: 30%;
        }
        table td.value { text-align: left; }
        .error {
            text-align: center;
            padding: 40px 20px;
            color: #000;
            font-size: 16px;
        }
        .loading {
            text-align: center;
            padding: 40px 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="content">
            <div class="loading">加载中...</div>
        </div>
    </div>

    <script>
        function getQueryParam(name) {
            return new URLSearchParams(window.location.search).get(name);
        }

        function esc(s) {
            return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        // 多条结论按两个空格分隔拆成多行显示（与参考样式一致）
        function multiline(s) {
            return esc(s).split(/\s{2,}/).filter(Boolean).join('<br>');
        }

        function renderReport(report) {
            const header = '<div class="header">该报告主要信息已上传至市住建委"北京市城镇房屋建筑使用安全管理系统"</div>';
            const rows = [
                ['报告类型', report.type || ''],
                ['报告唯一编码', report.code || ''],
                ['机构备案编号', report.orgCode || ''],
                ['鉴定机构', report.org || ''],
                ['项目名称', report.project || ''],
                ['房屋建筑地址', report.address || ''],
                ['评估鉴定结论', report.conclusion || ''],
                ['评估鉴定结论解释', report.conclusionDetail || ''],
                ['鉴定负责人', report.leader || ''],
                ['审核人', report.reviewer || ''],
                ['批准人', report.approver || ''],
                ['鉴定人', report.appraisers || '']
            ];
            let tableRows = '';
            rows.forEach(function (r) {
                const val = (r[0] === '评估鉴定结论' || r[0] === '评估鉴定结论解释')
                    ? multiline(r[1])
                    : esc(r[1]);
                tableRows += '<tr><td class="label">' + r[0] + '</td><td class="value">' + val + '</td></tr>';
            });
            document.getElementById('content').innerHTML = header + '<table>' + tableRows + '</table>';
            document.title = '';
        }

        function renderError(msg) {
            document.getElementById('content').innerHTML = '<div class="error">' + msg + '</div>';
        }

        function start() {
            let code = getQueryParam('code');
            if (!code) {
                // 直接打开页面（不带编号）时，默认显示第一份报告，便于预览
                const keys = Object.keys(window.REPORT_DATA);
                if (!keys.length) { renderError('暂无报告数据'); return; }
                code = keys[0];
            }
            const report = window.REPORT_DATA[code];
            if (!report) { renderError('未找到该报告'); return; }
            renderReport(report);
        }

        // 动态加载数据文件并附加时间戳，避免微信/浏览器缓存旧内容
        const script = document.createElement('script');
        script.src = 'data.js?v=' + Math.floor(Date.now() / 1000);
        script.onload = start;
        script.onerror = function () { renderError('数据加载失败，请稍后重试'); };
        document.body.appendChild(script);
    </script>
</body>
</html>
